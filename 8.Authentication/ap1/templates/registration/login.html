{% extends 'myapp/base.html'%}
{%load widget_tweaks%}
{%block body_block%}
   <div class="container">
    <div class="row d-flex justify-content-center mt-lg-5">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-secondary text-white text-center">
                    <p class="h3">Login Here</p>
                </div>
                <div class="card-body">
                    <form action="" method="POST">
                            {%csrf_token%}
                            <label for="" class="form-label">User Name</label>
                            {%render_field form.username class="form-control mb-3" placeholder="User Name"%}
                            <label for="" class="form-label">Password</label>
                            {%render_field form.password class="form-control mb-3" placeholder="Password"%}
                            <button class="btn btn-secondary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
   </div>
{%endblock%}
