{%extends 'myapp/base.html'%}
{%load widget_tweaks%}
{%block body_block%}
    <div class="container mt-5">
        
        <form action="" method="POST">
            {%csrf_token%}
            <div class="row d-flex justify-content-center">
                <div class="col-md-4">
                    <div class="card shadow-lg">
                        <div class="card-header bg-primary text-white text-center">
                            <p class="h2">Login Here</p>
                        </div>
                        <div class="card-body">
                           {%render_field form.username class="form-control mb-3" placeholder="username"%}
                           {%render_field form.password class="form-control mb-3" placeholder="password"%}
                            <button class="btn btn-primary btn-md w-100">Login</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
{%endblock%}
