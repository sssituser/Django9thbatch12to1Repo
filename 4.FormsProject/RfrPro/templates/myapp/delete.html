{%extends 'myapp/base.html'%}
{%load widget_tweaks%}

{%block body_block%}
    <h2 class="text-center text-danger">Do You Want to Delete ?</h2>
    <div class="container">
        <table class="table table-bordered table-hover text-center">
            <thead>
                <tr>
                    <th class="bg-primary text-white">Employee Id</th>
                    <th class="bg-primary text-white">Employee Name</th>
                    <th class="bg-primary text-white">Employee Salary</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{emp.EmployeeId}}</td>
                    <td>{{emp.EmployeeName}}</td>
                    <td>{{emp.EmployeeSalary}}</td>
                </tr>
            </tbody>
        </table>
        <form action="" method="POST">
            {% csrf_token %}
            <a href="/employees" class="btn btn-primary btn-sm">Back</a>
            <button class="btn btn-danger btn-sm">Delete</button>
        </form>
    </div>
{%endblock%}
