{%extends 'myapp/base.html'%}
{%load widget_tweaks%}

{%block body_block%}
    <h2 class="text-center text-danger">Do You Want to Delete ?</h2>
    <div class="container">
        <table class="table table-bordered table-hover text-center">
            <thead>
                <tr>
                    <th class="bg-primary text-white">Student Id</th>
                    <th class="bg-primary text-white">Student Name</th>
                    <th class="bg-primary text-white">Student Marks</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{stud.StudentId}}</td>
                    <td>{{stud.StudentName}}</td>
                    <td>{{stud.StudentMarks}}</td>
                </tr>
            </tbody>
        </table>
        <form action="" method="POST">
            {% csrf_token %}
            <a href="/students" class="btn btn-primary btn-sm">Back</a>
            <button class="btn btn-danger btn-sm">Delete</button>
        </form>
    </div>
{%endblock%}
