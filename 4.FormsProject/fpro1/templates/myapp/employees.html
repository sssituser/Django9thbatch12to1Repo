<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
</head>
<body>
 <div class="container">
    <div class="row d-flex justify-content-center mt-5">
        <div class="col-md-8">
            <a href="/" class="btn btn-sm btn-primary">Create</a>
            {%if emp_list%}
                <table class="table table-bordered table-striped table-hover text-capitalize text-center mt-5">
                    <thead>
                        <tr>
                            <th class="bg-primary text-white">Employee ID</th>
                            <th class="bg-primary text-white">Employee Name</th>
                            <th class="bg-primary text-white">Employee Salary</th>
                             <th class="bg-primary text-white">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {%for emp in emp_list%}
                            <tr>
                                <td>{{emp.EmpId}}</td>
                                <td>{{emp.EmpName}}</td>
                                <td>{{emp.EmpSal}}</td>
                                <td>
                                    Details
                                    Edit
                                    Delete
                                </td>
                            </tr>
                        {%endfor%}
                    </tbody>
                </table>
            {%else%}
                <h3 class="text-danger text-center">Records Not Found</h3>
            {%endif%}
        </div>
    </div>
 </div>
</body>
</html>
