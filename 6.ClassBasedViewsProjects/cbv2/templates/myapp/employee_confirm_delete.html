{%extends 'myapp/base.html'%}
{%load widget_tweaks%}
{%block body_block%}

<div class="container">
    <div class="row d-flex justify-content-center">
        <div class="col-md-5">
            <div class="card mt-5">
                
                <div class="card-header bg-primary text-danger text-center">
                    <p class="h3">
                       Do you want to Delete ?
                    </p>
                </div>

                <div class="card-body">
                   
                        <ul class="list-group">
                        <li class="list-group-item">
                            <p class="h3">Employee ID : {{employee.EmployeeId}}</p>
                        </li>
                        <li class="list-group-item">
                            <p class="h3">Employee Name : {{employee.EmployeeName}}</p>
                        </li>
                        <li class="list-group-item">
                            <p class="h3">Employee Salary : {{employee.EmployeeSalary}}</p>
                        </li>
                    </ul>
                   
                    
                </div>

                <div class="card-footer">
                    <form action="" method="POST">
                        {%csrf_token%}
                        <button class="btn btn-danger btn-sm">Delete</button>
                        <a href="/" class="btn btn-sm btn-warning float-end">Back to List</a>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>



{%endblock%}
